name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK / NDK packages
        run: sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Download cloudflared (arm64 + x86_64)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl -fL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          curl -fL --retry 3 -o app/src/main/jniLibs/x86_64/libcloudflared.so \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x app/src/main/jniLibs/*/libcloudflared.so
          ls -lh app/src/main/jniLibs/*/

      - name: Download terminal assets (xterm.js)
        run: |
          set -e
          mkdir -p app/src/main/assets/vendor
          curl -fL --retry 3 -o app/src/main/assets/vendor/xterm.js \
            https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js
          curl -fL --retry 3 -o app/src/main/assets/vendor/xterm.css \
            https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css
          curl -fL --retry 3 -o app/src/main/assets/vendor/addon-fit.js \
            https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js

      - name: Build APK (debug + release)
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ip-logger-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
